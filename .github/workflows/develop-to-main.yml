name: REACION DE RELEASE AUTOMATICA
run-name: CREACION DE RELEASE AUTOMATICA ${{ github.run_number }}
permissions:
  contents: write
on:
  pull_request:
    types:
      - closed
    branches:
      - main

jobs:
  run-on-merge:
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.base.ref == 'main' &&
      (
        startsWith(github.event.pull_request.head.ref, 'hotfix') ||
        startsWith(github.event.pull_request.head.ref, 'release')
      )
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Historial completo para merges correctos
      - name: Print message
        run: |
          if [[ "${{ github.event.pull_request.head.ref }}" == hotfix* ]]; then
            echo "Se ha hecho merge de un PR de hotfix a main."
          elif [[ "${{ github.event.pull_request.head.ref }}" == release* ]]; then
            echo "Se ha hecho merge de un PR de release a main."
          fi
      - name: Additional steps
        run: |
          echo "Aquí agregar más pasos según sea necesario test hotfix."

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10" # Asegúrate de que esté en la versión correcta

      # 3. Instalar dependencias necesarias
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip

      # 4. Crear un tag y release con el script Python
      - name: Crear tag y release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=v$(echo "${{ github.event.pull_request.head.ref }}" | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
          if [ -z "$VERSION" ] || [ "$VERSION" = "v" ]; then
            echo "ERROR: No se pudo extraer la versión del nombre de la rama (${{ github.event.pull_request.head.ref }})"
            exit 1
          fi

          # Determinar tipo de release
          if [[ "${{ github.event.pull_request.head.ref }}" == hotfix* ]]; then
            RELEASE_TYPE="Hotfix"
          else
            RELEASE_TYPE="Release"
          fi

          python .github/workflows/scripts/crear_release.py \
            --repo "${{ github.repository }}" \
            --version "$VERSION" \
            --nombre_release "$RELEASE_TYPE $VERSION" \
            --pr-title "${{ github.event.pull_request.title }}" \
            --pr-number "${{ github.event.pull_request.number }}" \
            --pr-body "${{ github.event.pull_request.body }}" \
            --branch "${{ github.event.pull_request.head.ref }}"

      - name: Crear o actualizar CHANGELOG.md
        run: |
          VERSION=v$(echo "${{ github.event.pull_request.head.ref }}" | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')

          python .github/workflows/scripts/crear_changelog.py \
            --version "$VERSION" \
            --pr-title "${{ github.event.pull_request.title }}" \
            --pr-number "${{ github.event.pull_request.number }}" \
            --pr-body "${{ github.event.pull_request.body }}" \
            --branch "${{ github.event.pull_request.head.ref }}" \
            --repo "${{ github.repository }}"

      - name: Configurar Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Commit y push del CHANGELOG.md
        run: |
          VERSION=v$(echo "${{ github.event.pull_request.head.ref }}" | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
          git add CHANGELOG.md
          git commit -m "chore: actualizar CHANGELOG.md para versión $VERSION" || echo "No hay cambios en CHANGELOG.md"
          git push origin main

      - name: Sincronizar main con develop (GitFlow)
        run: |
          git fetch origin develop main --unshallow 2>/dev/null || git fetch origin develop main
          git checkout develop

          # Merge de main a develop (práctica estándar de GitFlow)
          # --allow-unrelated-histories por si las ramas no comparten ancestro
          if git merge origin/main \
            --allow-unrelated-histories \
            -m "chore: merge main into develop after ${{ github.event.pull_request.head.ref }}" \
            --no-edit; then
            git push origin develop
            echo "Sincronización completada exitosamente"
          else
            echo "Conflicto detectado durante el merge"
            # Mostrar archivos en conflicto
            git diff --name-only --diff-filter=U || true
            # Abortar merge si existe
            git merge --abort 2>/dev/null || true
            echo "::error::Merge automático falló. Se requiere resolución manual de conflictos."
            exit 1
          fi
